<!DOCTYPE html>
<html lang="en">
<!-- Mettre le code langue du site dans l'attribut lang -->

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title><!-- Mettre le titre de la page --></title>
	<meta name="description" content="" />
	<!-- Mettre la description du contenu de la page dans l'attribut content -->

	<!-- Mettre ci-dessous les informations pour Open Graph (concerne notamment Facebook) - Voir https://ogp.me/-->
	<meta property="og:title" content="" />
	<meta property="og:type" content="" />
	<meta property="og:url" content="" />
	<meta property="og:image" content="" />

	<!-- Le minimum pour gérer les favicon : https://dev.to/masakudamatsu/favicon-nightmare-how-to-maintain-sanity-3al7 
    Icônes à générer : 
    favicon.ico : 32x32
    icon.svg : peu importe la taille, mais privilégier un format carré
    apple-touch-icon.png : 180x180
    192.png : 192x192
    512.png : 512x512

	Vous pouvez aussi utiliser un générateur : https://realfavicongenerator.net/
    -->
	<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="shortcut icon" href="/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/site.webmanifest" />
	<!-- voir le fichier manifest.webmanifest -->

	<!-- A terme : n'appeler qu'une seule feuille de style minifiée -->
	<link rel="stylesheet" href="dist/output.css" />
</head>
<body class="font-texte">
<!--
max-w-sm -> max6width: 24rem
rounded-2xl -> coins arrondis
shadow-lg -> ombre
md -> media query
-->
	<main>
		<header class="bg-creme">
			<div class="p-4">
				<div class="flex justify-between">
					<a class="flex  items-center ">
						<img src="img/logo-roussel.svg" alt="" class="font-titre">
						<p class="font-titre text-bordeaux rounded-2xl">Fleurs Roussel</p>
					</a>
					<button class="bg-framboise px-5 py-2">Commander</button>
				</div>

					<nav class="flex items-center text-sm justify-between gap-9">
						<p>Bouquets</p>
						<p>Ateliers</p>
						<p>Livraison</p>
						<p>Contact</p>
					</nav>
			</div>
		</header>
	</main>
</body>
<script src="js/nav.js"></script>
</html>
